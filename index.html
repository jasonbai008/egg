<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>收蛋人</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      height: 100%;
    }
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      cursor: pointer;
      user-select: none;
      font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      background: #1b1d22;
      color: rgba(255, 255, 255, 0.94);
      transition: background 0.55s ease;
    }
    .stage {
      position: relative;
      min-height: 1.2em;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .loader {
      width: 78px;
      height: 78px;
      position: relative;
    }
    .loader.hidden { display: none; }
    .ring {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      border: 2px solid transparent;
    }
    .ring-a {
      border-top-color: #fff;
      border-right-color: rgba(255, 255, 255, 0.18);
      animation: spin 0.85s linear infinite;
      filter: drop-shadow(0 0 8px rgba(255, 255, 255, 0.45));
    }
    .ring-b {
      inset: 12px;
      border-bottom-color: #ff6b6b;
      border-left-color: rgba(255, 107, 107, 0.2);
      animation: spin 1.35s linear infinite reverse;
      filter: drop-shadow(0 0 8px rgba(255, 90, 90, 0.4));
    }
    .core {
      position: absolute;
      inset: 30px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 30%, #fff, #ff8a80 45%, #c62828);
      box-shadow: 0 0 18px rgba(255, 80, 80, 0.55);
      animation: pulse 1.1s ease-in-out infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes pulse {
      0%, 100% { transform: scale(0.82); opacity: 0.75; }
      50% { transform: scale(1); opacity: 1; }
    }
    .pct {
      display: flex;
      align-items: center;
      font-size: clamp(40px, 9vw, 72px);
      font-weight: 560;
      font-variant-numeric: tabular-nums;
      letter-spacing: 0.02em;
      line-height: 1;
      text-shadow: 0 1px 12px rgba(0, 0, 0, 0.12);
    }
    .pct.hidden { display: none; }
    .reel {
      display: inline-block;
      height: 1em;
      overflow: hidden;
      vertical-align: top;
    }
    .strip {
      display: flex;
      flex-direction: column;
      will-change: transform;
    }
    .strip span {
      height: 1em;
      line-height: 1;
    }
  </style>
</head>
<body>
  <div class="stage">
    <div class="loader" id="loader">
      <div class="ring ring-a"></div>
      <div class="ring ring-b"></div>
      <div class="core"></div>
    </div>
    <div class="pct hidden" id="pct">
      <span id="prefix"></span>
      <span class="reel"><span class="strip" id="strip"></span></span>
    </div>
  </div>
  <script>
    const API = "https://tonghua.jasonbai.dpdns.org";
    const CODE = "511260.SH";
    const loader = document.getElementById("loader");
    const pctEl = document.getElementById("pct");
    const prefixEl = document.getElementById("prefix");
    const strip = document.getElementById("strip");

    const REPS = 8;
    strip.innerHTML = Array.from({ length: 10 * REPS }, (_, i) => "<span>" + (i % 10) + "</span>").join("");

    const THROTTLE_MS = 3000;
    let inflight = false;
    let loadedOnce = false;
    let lastFetchAt = 0;
    let reelIndex = 0;
    let lastText = "";

    function mix(a, b, t) {
      t = Math.min(1, Math.max(0, t));
      return a.map((v, i) => Math.round(v + (b[i] - v) * t));
    }
    function rgb(c) {
      return "rgb(" + c[0] + "," + c[1] + "," + c[2] + ")";
    }
    function digitH() {
      return strip.firstElementChild.getBoundingClientRect().height || 1;
    }

    function rollLast(digit) {
      const h = digitH();
      const current = reelIndex % 10;
      let delta = (digit - current + 10) % 10;
      if (delta === 0 && lastText) delta = 10;
      else if (!lastText) delta += 20;
      reelIndex += delta;
      strip.style.transition = "transform 0.95s cubic-bezier(0.18, 0.9, 0.22, 1)";
      strip.style.transform = "translateY(" + (-reelIndex * h) + "px)";
    }

    function hideNumber() {
      pctEl.classList.add("hidden");
      prefixEl.textContent = "";
      lastText = "";
    }

    function showNumber(text) {
      const last = Number(text.slice(-1));
      prefixEl.textContent = text.slice(0, -1);
      pctEl.classList.remove("hidden");
      requestAnimationFrame(() => rollLast(last));
      lastText = text;
    }

    function paint(ratio, fromLoad) {
      const downBg = [196, 222, 204];
      const flatBg = [232, 228, 224];
      const upMin = [196, 58, 56];
      const upMax = [138, 28, 32];

      loader.classList.add("hidden");

      if (ratio == null || Number.isNaN(ratio) || ratio <= 0) {
        document.body.style.background = rgb(ratio != null && ratio <= 0 ? downBg : flatBg);
        hideNumber();
        return;
      }

      const t = Math.min(ratio / 0.8, 1);
      document.body.style.background = rgb(mix(upMin, upMax, t));
      showNumber(ratio.toFixed(2));
    }

    async function refresh(fromLoad) {
      const now = Date.now();
      if (inflight) return;
      if (!fromLoad && now - lastFetchAt < THROTTLE_MS) return;
      inflight = true;
      lastFetchAt = now;
      if (fromLoad || !lastText) {
        document.body.style.background = "#1b1d22";
        hideNumber();
        loader.classList.remove("hidden");
      }
      try {
        const res = await fetch(
          API + "/api/fund/market/snapshot?thscode=" + encodeURIComponent(CODE)
        );
        if (!res.ok) throw new Error("HTTP " + res.status);
        const json = await res.json();
        if (json.code !== 0) throw new Error(json.message || "业务错误");
        const row = (json.data && json.data.item && json.data.item[0]) || null;
        const ratio = row ? Number(row.price_change_ratio_pct) : null;
        paint(ratio, fromLoad);
      } catch (e) {
        paint(null, fromLoad);
      } finally {
        inflight = false;
        loadedOnce = true;
      }
    }

    document.body.addEventListener("click", function () {
      if (!loadedOnce || inflight) return;
      if (Date.now() - lastFetchAt < THROTTLE_MS) return;
      refresh(false);
    });
    refresh(true);
  </script>
</body>
</html>
